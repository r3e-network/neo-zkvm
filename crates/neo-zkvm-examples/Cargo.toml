[package]
name = "neo-zkvm-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Usage examples for Neo zkVM"
publish = false

[[bin]]
name = "basic"
path = "src/basic.rs"

[[bin]]
name = "proof_generation"
path = "src/proof_generation.rs"

[[bin]]
name = "batch_verification"
path = "src/batch_verification.rs"

[[bin]]
name = "private_inputs"
path = "src/private_inputs.rs"

[[bin]]
name = "tamper_resistance"
path = "src/tamper_resistance.rs"

[[bin]]
name = "zk_preimage"
path = "src/zk_preimage.rs"

[[bin]]
name = "zk_scaling"
path = "src/zk_scaling.rs"

[[bin]]
name = "zk_dao_voting"
path = "src/zk_dao_voting.rs"

[[bin]]
name = "zk_dex_rollup"
path = "src/zk_dex_rollup.rs"

# Ethereum zkVM-style tutorial examples (RISC Zero / SP1 analogues)
[[bin]]
name = "zk_factors"
path = "src/zk_factors.rs"

[[bin]]
name = "zk_range"
path = "src/zk_range.rs"

[[bin]]
name = "zk_membership"
path = "src/zk_membership.rs"

[[bin]]
name = "zk_selective_disclosure"
path = "src/zk_selective_disclosure.rs"

[[bin]]
name = "zk_merkle_inclusion"
path = "src/zk_merkle_inclusion.rs"

[dependencies]
neo-vm-guest = { workspace = true }
neo-zkvm-prover = { workspace = true }
neo-zkvm-verifier = { workspace = true }
hex.workspace = true

[features]
default = []
sp1 = ["neo-zkvm-prover/sp1", "neo-zkvm-verifier/sp1"]
