[package]
name = "neo-zkvm-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/neo-zkvm-prover"
readme = "README.md"
description = "SP1-backed proof generation for Neo zkVM"
keywords.workspace = true
categories.workspace = true

[dependencies]
neo-vm-guest = { workspace = true }
sp1-sdk = { workspace = true, optional = true }
bincode.workspace = true

[features]
default = []
sp1 = ["dep:sp1-sdk", "dep:sp1-build"]
# Force dummy ELF markers even when a toolchain is present (CI / analysis).
# Equivalent to SP1_FORCE_DUMMY=1 at build time; also enables mock_elf_available cfg.
mock-elf = []

[build-dependencies]
sp1-build = { version = "6.2.1", optional = true }
