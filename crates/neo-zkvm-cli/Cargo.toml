[package]
name = "neo-zkvm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/neo-zkvm-cli"
readme = "README.md"
description = "CLI for Neo zkVM script execution, proving, and verification"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "neo-zkvm"
path = "src/main.rs"

[dependencies]
neo-vm-guest = { workspace = true }
neo-vm-rs = { workspace = true }
neo-zkvm-prover = { workspace = true }
neo-zkvm-verifier = { workspace = true }
neo-zkvm-attestation = { workspace = true }
hex.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
sp1 = ["neo-zkvm-prover/sp1", "neo-zkvm-verifier/sp1"]
