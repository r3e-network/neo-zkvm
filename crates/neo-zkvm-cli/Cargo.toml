[package]
name = "neo-zkvm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Neo zkVM script execution, proving, and verification"

[[bin]]
name = "neo-zkvm"
path = "src/main.rs"

[dependencies]
neo-vm-core = { workspace = true }
neo-vm-guest = { workspace = true }
neo-vm-rs = { workspace = true }
neo-zkvm-prover = { workspace = true }
neo-zkvm-verifier = { workspace = true }
hex.workspace = true

[features]
default = []
sp1 = ["neo-zkvm-prover/sp1", "neo-zkvm-verifier/sp1"]
