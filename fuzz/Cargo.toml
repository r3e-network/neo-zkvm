[package]
name = "neo-zkvm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
neo-vm-guest = { path = "../crates/neo-vm-guest" }

[[bin]]
name = "fuzz_vm_execution"
path = "fuzz_targets/fuzz_vm_execution.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_script_parser"
path = "fuzz_targets/fuzz_script_parser.rs"
test = false
doc = false
bench = false

# Standard cargo-fuzz pattern: the fuzz crate lives outside the parent workspace
# so it can use nightly Rust (required by libfuzzer-sys) without forcing nightly
# on the entire workspace. The empty [workspace] declaration prevents cargo from
# ascending to the parent workspace and inheriting its resolver/edition constraints.
[workspace]
