name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check formatting first (fast)
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  # Run clippy for code quality
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Keep the optional SP1 host integration compiling without making default checks
  # depend on a local Succinct toolchain or a real guest ELF.
  sp1-feature-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-sp1"
      - name: SP1 feature clippy
        run: SP1_FORCE_DUMMY=true cargo clippy -p neo-zkvm-prover -p neo-zkvm-verifier -p neo-zkvm-cli --features sp1 --locked -- -D warnings
      - name: SP1 feature tests (dummy ELF)
        run: SP1_FORCE_DUMMY=true cargo test -p neo-zkvm-prover -p neo-zkvm-verifier -p neo-zkvm-cli --features sp1 --locked

  # Build the project
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Build debug
        run: cargo build --workspace --locked
      - name: Build release
        run: cargo build --release --workspace --locked

  # Run all tests
  test:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Run tests
        run: cargo test --workspace --all-targets --locked --verbose

  # Run examples
  examples:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Run basic example
        run: cargo run --locked --bin basic
      - name: Run proof generation example
        run: cargo run --locked --bin proof_generation
      - name: Run batch verification example
        run: cargo run --locked --bin batch_verification
      - name: Run private inputs example
        run: cargo run --locked --bin private_inputs
      - name: Run tamper resistance example
        run: cargo run --locked --bin tamper_resistance
      - name: Run preimage example
        run: cargo run --locked --bin zk_preimage
      - name: Run scaling example
        run: cargo run --locked --bin zk_scaling
      - name: Run DAO voting example
        run: cargo run --locked --bin zk_dao_voting
      - name: Run DEX rollup example
        run: cargo run --locked --bin zk_dex_rollup
      - name: Run Ethereum-style factors example
        run: cargo run --locked --bin zk_factors
      - name: Run Ethereum-style range example
        run: cargo run --locked --bin zk_range
      - name: Run Ethereum-style membership example
        run: cargo run --locked --bin zk_membership
      - name: Run Ethereum-style selective disclosure example
        run: cargo run --locked --bin zk_selective_disclosure
      - name: Run Ethereum-style Merkle inclusion example
        run: cargo run --locked --bin zk_merkle_inclusion
      - name: Run attestation settlement example
        run: cargo run --locked --bin zk_attestation_settlement

  # Run bounded fuzz smoke checks
  fuzz-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-fuzz"
      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --locked --version 0.13.1
      - name: Fuzz VM execution (smoke)
        run: |
          cd fuzz
          cargo +nightly fuzz run --sanitizer none fuzz_vm_execution -- -runs=256 -max_len=512
      - name: Fuzz script parser (smoke)
        run: |
          cd fuzz
          cargo +nightly fuzz run --sanitizer none fuzz_script_parser -- -runs=256 -max_len=512
      - name: Fuzz raw scripts (smoke)
        run: |
          cd fuzz
          cargo +nightly fuzz run --sanitizer none fuzz_raw_script -- -runs=256 -max_len=512
      - name: Fuzz proof pipeline (smoke)
        run: |
          cd fuzz
          cargo +nightly fuzz run --sanitizer none fuzz_proof_pipeline -- -runs=128 -max_len=256
      - name: Fuzz bincode (smoke)
        run: |
          cd fuzz
          cargo +nightly fuzz run --sanitizer none fuzz_bincode -- -runs=256 -max_len=1024
      - name: Fuzz assembler (smoke)
        run: |
          cd fuzz
          cargo +nightly fuzz run --sanitizer none fuzz_assembler -- -runs=256 -max_len=512
      - name: Fuzz attestation / N-of-M ECDSA (smoke)
        run: |
          cd fuzz
          cargo +nightly fuzz run --sanitizer none fuzz_attestation -- -runs=512 -max_len=512

  # Build and test documentation
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Build documentation
        run: cargo doc --workspace --locked --no-deps
      - name: Test documentation
        run: cargo test --doc --workspace --locked

  # Code coverage (optional, can be slow)
  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked --version 0.32.7
      - name: Code coverage
        run: cargo tarpaulin --workspace --exclude neo-zkvm-program --out Xml --skip-clean
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  # Security audit
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.9
      - name: Security advisories
        run: cargo deny --all-features --locked check advisories --show-stats
      - name: Dependency bans and sources
        run: cargo deny --all-features --locked -L error check bans sources --hide-inclusion-graph --show-stats
      - name: License policy
        run: cargo deny --all-features --locked check licenses --show-stats
