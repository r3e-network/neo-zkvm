name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check formatting first (fast)
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  # Run clippy for code quality
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Build the project
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Build debug
        run: cargo build --workspace --locked
      - name: Build release
        run: cargo build --release --workspace --locked

  # Run all tests
  test:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Run tests
        run: cargo test --workspace --all-targets --locked --verbose

  # Run examples
  examples:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Run basic example
        run: cargo run --locked --bin basic
      - name: Run storage example
        run: cargo run --locked --bin storage_example
      - name: Run native contracts example
        run: cargo run --locked --bin native_contracts
      - name: Run proof generation example
        run: cargo run --locked --bin proof_generation
      - name: Run batch verification example
        run: cargo run --locked --bin batch_verification
      - name: Run private inputs example
        run: cargo run --locked --bin private_inputs
      - name: Run tamper resistance example
        run: cargo run --locked --bin tamper_resistance

  # Run bounded fuzz smoke checks
  fuzz-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-fuzz"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1
      - name: Fuzz VM execution (smoke)
        run: |
          cd fuzz
          cargo +nightly fuzz run fuzz_vm_execution -- -runs=128 -max_len=512
      - name: Fuzz script parser (smoke)
        run: |
          cd fuzz
          cargo +nightly fuzz run fuzz_script_parser -- -runs=128 -max_len=512

  # Build and test documentation
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Build documentation
        run: cargo doc --workspace --locked --no-deps
      - name: Test documentation
        run: cargo test --doc --workspace --locked

  # Code coverage (optional, can be slow)
  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Code coverage
        run: cargo tarpaulin --workspace --out Xml --skip-clean
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  # Security audit
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.9
      - name: Security advisories
        run: cargo deny --locked check advisories --show-stats
      - name: Dependency bans and sources
        run: cargo deny --locked -L error check bans sources --hide-inclusion-graph --show-stats
      - name: License policy
        run: cargo deny --locked check licenses --show-stats
