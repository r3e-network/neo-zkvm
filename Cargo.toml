[workspace]
resolver = "2"
members = [
    "crates/neo-vm-guest",
    "crates/neo-zkvm-prover",
    "crates/neo-zkvm-verifier",
    "crates/neo-zkvm-attestation",
    "crates/neo-zkvm-cli",
    "crates/neo-zkvm-program",
    "crates/neo-zkvm-examples",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/r3e-network/neo-zkvm"
homepage = "https://github.com/r3e-network/neo-zkvm"
documentation = "https://docs.rs/neo-zkvm-prover"
readme = "README.md"
keywords = ["neo", "zkvm", "zero-knowledge", "sp1", "blockchain"]
categories = ["cryptography", "development-tools"]
rust-version = "1.88"

[workspace.dependencies]
# Shared NeoVM semantics.
# `version` is required for crates.io packaging; keep git+rev for reproducible
# workspace builds until neo-vm-rs is published and consumers pin a crates.io release.
neo-vm-rs = { version = "0.2.0", git = "https://github.com/r3e-network/neo-vm-rs.git", rev = "dbaaa6a343b390009198e6eb9576832e8dc9b71d" }
neo-vm-guest = { path = "crates/neo-vm-guest", version = "0.2.2" }
neo-zkvm-prover = { path = "crates/neo-zkvm-prover", version = "0.2.2" }
neo-zkvm-verifier = { path = "crates/neo-zkvm-verifier", version = "0.2.2" }
neo-zkvm-attestation = { path = "crates/neo-zkvm-attestation", version = "0.2.2" }

# zkVM frameworks
sp1-sdk = { version = "=6.2.1", default-features = false, features = ["blocking"] }
sp1-zkvm = "=6.2.1"

# Cryptography
sha2 = { version = "0.11", default-features = false }
ripemd = { version = "0.1", default-features = false }
# Serialization
serde = { version = "1.0", features = ["derive", "alloc"] }
bincode = { version = "2.0.1", default-features = false, features = ["alloc", "serde"] }

# Utils
thiserror = "2.0"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
