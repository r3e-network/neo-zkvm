[workspace]
resolver = "2"
members = [
    "crates/neo-vm-core",
    "crates/neo-vm-guest",
    "crates/neo-zkvm-prover",
    "crates/neo-zkvm-verifier",
    "crates/neo-zkvm-cli",
    "crates/neo-zkvm-program",
    "crates/neo-zkvm-examples",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/neo-project/neo-zkvm"
rust-version = "1.75"

[workspace.dependencies]
# Neo VM Core
neo-vm-core = { path = "crates/neo-vm-core", version = "0.2.2" }
neo-vm-guest = { path = "crates/neo-vm-guest", version = "0.2.2" }
neo-zkvm-prover = { path = "crates/neo-zkvm-prover", version = "0.2.2" }
neo-zkvm-verifier = { path = "crates/neo-zkvm-verifier", version = "0.2.2" }

# zkVM frameworks
sp1-sdk = { version = "5.2", default-features = false }
sp1-zkvm = "5.2"

# Cryptography
sha2 = "0.10"
ripemd = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }

# Serialization
serde = { version = "1.0", features = ["derive", "alloc"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.22"

# Utils
thiserror = "2.0"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
