[advisories]
ignore = [
    { id = "RUSTSEC-2021-0139", reason = "Optional SP1 6.2.1 proving stack pulls ansi_term through tracing-forest; no maintained drop-in is exposed by upstream SP1 yet." },
    { id = "RUSTSEC-2024-0436", reason = "Optional SP1 6.2.1 proving stack pulls paste through rrs-succinct/dashu macros; not directly used by neo-zkvm code." },
    { id = "RUSTSEC-2025-0119", reason = "Optional SP1 6.2.1 proving stack pulls number_prefix through indicatif; upstream has no patched replacement in the current graph." },
    { id = "RUSTSEC-2025-0134", reason = "Optional SP1 6.2.1 proving stack pulls rustls-pemfile through tonic/sp1-prover-types; replacement must happen upstream." },
    { id = "RUSTSEC-2025-0141", reason = "Direct use is pinned to bincode 2.0.1 with explicit size/trailing-byte checks; bincode 3.0.0 is currently a compile-error placeholder, and SP1 still pulls bincode 1.3.3 transitively." },
    { id = "RUSTSEC-2026-0002", reason = "Optional SP1 6.2.1 proving stack pulls lru 0.12.5; no patched version is available under current upstream constraints." },
]

[bans]
multiple-versions = "warn"
skip-tree = [
    { crate = "sp1-sdk@6.2.1", reason = "SP1 is an upstream proving stack with a large internally versioned dependency graph; advisories and licenses are still checked separately." },
    { crate = "sp1-zkvm@6.2.1", reason = "SP1 guest dependencies are controlled by upstream SP1 releases; duplicate checks here create noise without an actionable workspace fix." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

# halo2 publishes licensing via COPYING and omits a machine-readable SPDX field.
[[licenses.clarify]]
crate = "halo2"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "COPYING", hash = 0x106164e0 },
]
