<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="930" viewBox="0 0 1640 930" role="img" aria-labelledby="title desc">
<title id="title">Neo zkVM Dataflow</title>
<desc id="desc">How bytes become execution output, public inputs, proof bytes, and verification evidence.</desc>

<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
  </marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
  </marker>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 30px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
    .section { font: 700 14px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; letter-spacing: 0.08em; }
    .box-title { font: 700 19px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
    .box-subtitle { font: 500 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
    .item { font: 400 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
    .small { font: 400 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
    .label { font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
    .formula { font: 500 16px "Cascadia Code", Consolas, monospace; fill: #111827; }
    .mono { font: 500 13px "Cascadia Code", Consolas, monospace; fill: #334155; }
  </style>
</defs>

<rect class="bg" x="0" y="0" width="1640" height="930"/>
<text x="48.0" y="56.0" class="title" text-anchor="start">Neo zkVM Dataflow</text>
<text x="48.0" y="84.0" class="subtitle" text-anchor="start">How bytes become execution output, public inputs, proof bytes, and verification evidence.</text>
<rect x="55" y="160" width="205" height="235" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="73.0" y="192.0" class="box-title" text-anchor="start">Source Request</text>
<text x="73.0" y="215.0" class="box-subtitle" text-anchor="start">script + arguments + gas</text>
<circle cx="80" cy="236" r="4" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<text x="93.0" y="241.0" class="item" text-anchor="start">CLI</text>
<circle cx="80" cy="259" r="4" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<text x="93.0" y="264.0" class="item" text-anchor="start">library API</text>
<circle cx="80" cy="282" r="4" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<text x="93.0" y="287.0" class="item" text-anchor="start">test harness</text>
<rect x="315" y="160" width="205" height="235" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="333.0" y="192.0" class="box-title" text-anchor="start">ProofInput</text>
<text x="333.0" y="215.0" class="box-subtitle" text-anchor="start">serialized with bincode</text>
<circle cx="340" cy="236" r="4" fill="none" stroke="#d97706" stroke-width="1.8"/>
<text x="353.0" y="241.0" class="item" text-anchor="start">script: Vec&lt;u8&gt;</text>
<circle cx="340" cy="259" r="4" fill="none" stroke="#d97706" stroke-width="1.8"/>
<text x="353.0" y="264.0" class="item" text-anchor="start">arguments: Vec&lt;StackItem&gt;</text>
<circle cx="340" cy="282" r="4" fill="none" stroke="#d97706" stroke-width="1.8"/>
<text x="353.0" y="287.0" class="item" text-anchor="start">gas_limit: u64</text>
<rect x="595" y="160" width="205" height="235" rx="8" fill="#ecfdf3" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="613.0" y="192.0" class="box-title" text-anchor="start">Host Execution</text>
<text x="613.0" y="215.0" class="box-subtitle" text-anchor="start">neo-vm-guest -&gt; neo-vm-rs</text>
<circle cx="620" cy="236" r="4" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<text x="633.0" y="241.0" class="item" text-anchor="start">validate input</text>
<circle cx="620" cy="259" r="4" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<text x="633.0" y="264.0" class="item" text-anchor="start">estimate/cap gas</text>
<circle cx="620" cy="282" r="4" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<text x="633.0" y="287.0" class="item" text-anchor="start">interpret with zk syscalls</text>
<rect x="875" y="160" width="205" height="235" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
<text x="893.0" y="192.0" class="box-title" text-anchor="start">ProofOutput</text>
<text x="893.0" y="215.0" class="box-subtitle" text-anchor="start">deterministic VM result</text>
<circle cx="900" cy="236" r="4" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<text x="913.0" y="241.0" class="item" text-anchor="start">state</text>
<circle cx="900" cy="259" r="4" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<text x="913.0" y="264.0" class="item" text-anchor="start">result</text>
<circle cx="900" cy="282" r="4" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<text x="913.0" y="287.0" class="item" text-anchor="start">gas_consumed</text>
<circle cx="900" cy="305" r="4" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<text x="913.0" y="310.0" class="item" text-anchor="start">error</text>
<rect x="1155" y="160" width="205" height="235" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="1173.0" y="192.0" class="box-title" text-anchor="start">PublicInputs</text>
<text x="1173.0" y="215.0" class="box-subtitle" text-anchor="start">verification binding</text>
<circle cx="1180" cy="236" r="4" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1193.0" y="241.0" class="item" text-anchor="start">script_hash</text>
<circle cx="1180" cy="259" r="4" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1193.0" y="264.0" class="item" text-anchor="start">input_hash</text>
<circle cx="1180" cy="282" r="4" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1193.0" y="287.0" class="item" text-anchor="start">output_hash</text>
<circle cx="1180" cy="305" r="4" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1193.0" y="310.0" class="item" text-anchor="start">gas + success</text>
<rect x="1395" y="160" width="200" height="235" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<text x="1413.0" y="192.0" class="box-title" text-anchor="start">NeoProof</text>
<text x="1413.0" y="215.0" class="box-subtitle" text-anchor="start">portable proof envelope</text>
<circle cx="1420" cy="236" r="4" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="1433.0" y="241.0" class="item" text-anchor="start">output</text>
<circle cx="1420" cy="259" r="4" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="1433.0" y="264.0" class="item" text-anchor="start">proof_bytes</text>
<circle cx="1420" cy="282" r="4" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="1433.0" y="287.0" class="item" text-anchor="start">public_inputs</text>
<circle cx="1420" cy="305" r="4" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="1433.0" y="310.0" class="item" text-anchor="start">vkey_hash + mode</text>
<line x1="260" y1="277" x2="315" y2="277" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
<line x1="520" y1="277" x2="595" y2="277" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
<line x1="800" y1="277" x2="875" y2="277" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
<line x1="1080" y1="277" x2="1155" y2="277" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
<line x1="1360" y1="277" x2="1395" y2="277" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
<rect x="595" y="505" width="485" height="175" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<text x="613.0" y="531.0" class="section" text-anchor="start">CRYPTOGRAPHIC PATH</text>
<text x="613.0" y="559.0" class="box-title" text-anchor="start">SP1 Guest Re-execution</text>
<text x="613.0" y="582.0" class="box-subtitle" text-anchor="start">neo-zkvm-program</text>
<circle cx="620" cy="603" r="4" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="633.0" y="608.0" class="item" text-anchor="start">reads ProofInput inside zkVM</text>
<circle cx="620" cy="626" r="4" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="633.0" y="631.0" class="item" text-anchor="start">executes the same guest boundary</text>
<circle cx="620" cy="649" r="4" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="633.0" y="654.0" class="item" text-anchor="start">commits PublicInputs as public values</text>
<rect x="1155" y="505" width="440" height="175" rx="8" fill="#ecfdf3" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="1173.0" y="531.0" class="section" text-anchor="start">VERIFICATION</text>
<text x="1173.0" y="559.0" class="box-title" text-anchor="start">Verifier Evidence</text>
<text x="1173.0" y="582.0" class="box-subtitle" text-anchor="start">host checks before accepting</text>
<circle cx="1180" cy="603" r="4" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<text x="1193.0" y="608.0" class="item" text-anchor="start">proof mode policy</text>
<circle cx="1180" cy="626" r="4" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<text x="1193.0" y="631.0" class="item" text-anchor="start">proof bytes / vkey</text>
<circle cx="1180" cy="649" r="4" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<text x="1193.0" y="654.0" class="item" text-anchor="start">public values equal PublicInputs</text>
<line x1="697" y1="395" x2="697" y2="505" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
<text x="697.0" y="442.0" class="label" text-anchor="middle">input</text>
<line x1="980" y1="505" x2="1155" y2="592" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
<text x="1067.5" y="540.5" class="label" text-anchor="middle">committed public values</text>
<line x1="1495" y1="395" x2="1375" y2="505" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<text x="1435.0" y="442.0" class="label" text-anchor="middle">proof envelope</text>
<rect x="55" y="735" width="1540" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="73.0" y="767.0" class="box-title" text-anchor="start">Hash and commitment binding</text>
<text x="77.0" y="797.0" class="formula" text-anchor="start">H_script = SHA256(script)</text>
<text x="77.0" y="829.0" class="formula" text-anchor="start">H_input = SHA256(Encode(ProofInput)); H_output = SHA256(Encode(ProofOutput))</text>
<text x="77.0" y="861.0" class="formula" text-anchor="start">commitment = SHA256(H_script || H_input || H_output || LE64(gas_consumed) || success_byte)</text>
</svg>
