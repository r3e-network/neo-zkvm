<text x="1333.0" y="226.0" class="item" text-anchor="start">false</text>
<line x1="290" y1="198" x2="300" y2="198" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<line x1="540" y1="198" x2="610" y2="198" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<text x="575.0" y="190.0" class="label" text-anchor="middle">yes</text>
