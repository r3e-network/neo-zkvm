<text x="1375.0" y="292.0" class="label" text-anchor="middle">no</text>
<polyline points="740.0,258.0 740.0,300.0 1375.0,300.0 1375.0,250.0" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
<text x="1375.0" y="292.0" class="label" text-anchor="middle">no</text>
<polyline points="1070.0,258.0 1070.0,300.0 1375.0,300.0 1375.0,250.0" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
<text x="1375.0" y="292.0" class="label" text-anchor="middle">no</text>
<rect x="115" y="430" width="330" height="210" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
<text x="133.0" y="462.0" class="box-title" text-anchor="start">Execute mode</text>
<text x="133.0" y="485.0" class="box-subtitle" text-anchor="start">deterministic execution only</text>
<circle cx="140" cy="506" r="4" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<text x="153.0" y="511.0" class="item" text-anchor="start">no proof bytes required</text>
<circle cx="140" cy="529" r="4" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<text x="153.0" y="534.0" class="item" text-anchor="start">accepted only after binding checks</text>
<rect x="585" y="430" width="330" height="210" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="603.0" y="462.0" class="box-title" text-anchor="start">Mock mode</text>
<text x="603.0" y="485.0" class="box-subtitle" text-anchor="start">development and tests</text>
<circle cx="610" cy="506" r="4" fill="none" stroke="#d97706" stroke-width="1.8"/>
<text x="623.0" y="511.0" class="item" text-anchor="start">decode MockProof</text>
<circle cx="610" cy="529" r="4" fill="none" stroke="#d97706" stroke-width="1.8"/>
<text x="623.0" y="534.0" class="item" text-anchor="start">public inputs must equal</text>
<circle cx="610" cy="552" r="4" fill="none" stroke="#d97706" stroke-width="1.8"/>
<text x="623.0" y="557.0" class="item" text-anchor="start">commitment must recompute</text>
<rect x="1055" y="430" width="330" height="210" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<text x="1073.0" y="462.0" class="box-title" text-anchor="start">SP1 / PLONK / Groth16</text>
