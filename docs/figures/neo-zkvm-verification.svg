<text x="740.0" y="203.0" class="label" text-anchor="middle">output matches PI?</text>
<polygon points="1070.0,138.0 1180.0,198.0 1070.0,258.0 960.0,198.0" fill="#ecfdf3" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="1070.0" y="203.0" class="label" text-anchor="middle">state == HALT?</text>
