<circle cx="1080" cy="575" r="4" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="1093.0" y="580.0" class="item" text-anchor="start">public values equal PI</text>
<polyline points="1070.0,258.0 1070.0,345.0 280.0,345.0 280.0,430.0" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
<text x="280.0" y="337.0" class="label" text-anchor="middle">mode branch</text>
<polyline points="1070.0,345.0 750.0,345.0 750.0,430.0" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
<polyline points="1070.0,345.0 1220.0,345.0 1220.0,430.0" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
<rect x="615" y="770" width="290" height="100" rx="8" fill="#ecfdf3" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="633.0" y="802.0" class="box-title" text-anchor="start">Valid</text>
<text x="633.0" y="825.0" class="box-subtitle" text-anchor="start">all selected checks passed</text>
<circle cx="640" cy="846" r="4" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<text x="653.0" y="851.0" class="item" text-anchor="start">true</text>
<line x1="280" y1="640" x2="615" y2="820" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<text x="447.5" y="722.0" class="label" text-anchor="middle">pass</text>
<line x1="750" y1="640" x2="750" y2="770" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<text x="750.0" y="697.0" class="label" text-anchor="middle">pass</text>
<line x1="1220" y1="640" x2="905" y2="820" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<text x="1062.5" y="722.0" class="label" text-anchor="middle">pass</text>
<polyline points="445.0,535.0 1295.0,535.0" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
