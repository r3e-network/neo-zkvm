<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1030" viewBox="0 0 1540 1030" role="img" aria-labelledby="title desc">
<title id="title">Neo zkVM Mathematical Design</title>
<desc id="desc">Public-input binding and proof statements used by host, guest, and verifier.</desc>

<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
  </marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
  </marker>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 30px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
    .section { font: 700 14px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; letter-spacing: 0.08em; }
    .box-title { font: 700 19px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
    .box-subtitle { font: 500 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
    .item { font: 400 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
    .small { font: 400 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
    .label { font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
    .formula { font: 500 16px "Cascadia Code", Consolas, monospace; fill: #111827; }
    .mono { font: 500 13px "Cascadia Code", Consolas, monospace; fill: #334155; }
  </style>
</defs>

<rect class="bg" x="0" y="0" width="1540" height="1030"/>
<text x="48.0" y="56.0" class="title" text-anchor="start">Neo zkVM Mathematical Design</text>
<text x="48.0" y="84.0" class="subtitle" text-anchor="start">Public-input binding and proof statements used by host, guest, and verifier.</text>
<rect x="70" y="145" width="640" height="215" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="88.0" y="177.0" class="box-title" text-anchor="start">Definitions</text>
<text x="92.0" y="207.0" class="formula" text-anchor="start">Encode(x) = canonical bincode encoding</text>
<text x="92.0" y="239.0" class="formula" text-anchor="start">H(x) = SHA-256(x)</text>
<text x="92.0" y="271.0" class="formula" text-anchor="start">success = (state == HALT) and (error == None)</text>
<text x="92.0" y="303.0" class="formula" text-anchor="start">LE64(gas) = 8-byte little-endian gas</text>
<rect x="830" y="145" width="640" height="215" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="848.0" y="177.0" class="box-title" text-anchor="start">Public Inputs</text>
<text x="852.0" y="207.0" class="formula" text-anchor="start">h_s = H(script)</text>
<text x="852.0" y="239.0" class="formula" text-anchor="start">h_i = H(Encode(ProofInput))</text>
<text x="852.0" y="271.0" class="formula" text-anchor="start">h_o = H(Encode(ProofOutput))</text>
<text x="852.0" y="303.0" class="formula" text-anchor="start">PI = (h_s, h_i, h_o, gas_consumed, success)</text>
<rect x="70" y="430" width="640" height="250" rx="8" fill="#ecfdf3" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="88.0" y="462.0" class="box-title" text-anchor="start">Execution Relation</text>
<text x="92.0" y="492.0" class="formula" text-anchor="start">Exec_neo-vm-rs(ProofInput) -&gt; ProofOutput</text>
<text x="92.0" y="524.0" class="formula" text-anchor="start">gas_consumed &lt;= gas_limit</text>
<text x="92.0" y="556.0" class="formula" text-anchor="start">script size &lt;= PROOF_MAX_SCRIPT_SIZE</text>
<text x="92.0" y="588.0" class="formula" text-anchor="start">StackItem semantics = neo_vm_rs::StackValue</text>
<rect x="830" y="430" width="640" height="250" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="848.0" y="462.0" class="box-title" text-anchor="start">Commitment</text>
<text x="852.0" y="492.0" class="formula" text-anchor="start">C = H(h_s || h_i || h_o ||</text>
<text x="852.0" y="524.0" class="formula" text-anchor="start">      LE64(gas_consumed) || byte(success))</text>
<text x="852.0" y="556.0" class="formula" text-anchor="start">MockProof.commitment must equal C</text>
<text x="852.0" y="588.0" class="formula" text-anchor="start">SP1 public values must equal PI</text>
<rect x="70" y="760" width="1400" height="160" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<text x="88.0" y="792.0" class="box-title" text-anchor="start">Verifier Acceptance Conditions</text>
<text x="92.0" y="822.0" class="formula" text-anchor="start">version == PROOF_FORMAT_VERSION</text>
<text x="92.0" y="854.0" class="formula" text-anchor="start">H(Encode(output)) == PI.output_hash and output.gas_consumed == PI.gas_consumed</text>
<text x="92.0" y="886.0" class="formula" text-anchor="start">mode == Mock: commitment == C; mode in {SP1, PLONK, Groth16}: SP1 verifier accepts proof and vkey hash</text>
<line x1="710" y1="252" x2="830" y2="252" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
<text x="770.0" y="244.0" class="label" text-anchor="middle">hashes</text>
<line x1="710" y1="555" x2="830" y2="555" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
<text x="770.0" y="547.0" class="label" text-anchor="middle">binds</text>
<polyline points="390.0,680.0 390.0,760.0" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<text x="390.0" y="752.0" class="label" text-anchor="middle">output</text>
<polyline points="1150.0,680.0 1150.0,760.0" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
<text x="1150.0" y="752.0" class="label" text-anchor="middle">proof statement</text>
</svg>
